name: OWRD readings
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: owrd
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Previous readings (kept for any gauge that fails this time)
        run: git clone --depth 1 -b data "https://github.com/${{ github.repository }}" out || mkdir out
      - name: Download from OWRD
        run: python3 tools/fetch-owrd.py out
      - name: Publish to the data branch (one commit, no history)
        run: |
          cd out && rm -rf .git && git init -q -b data
          git config user.name "owrd-bot" && git config user.email "261564343+myusernameismax@users.noreply.github.com"
          git add -A && git commit -qm "OWRD readings $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" data
