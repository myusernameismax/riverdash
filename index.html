<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Flow Tides</title>
<meta name="description" content="NOAA river levels, flows, tides, waves and weather">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flow Tides">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.water.noaa.gov https://api.tidesandcurrents.noaa.gov https://api.waterdata.usgs.gov https://waterservices.usgs.gov https://api.open-meteo.com https://marine-api.open-meteo.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<!-- iPhone 13 mini launch screen (same picture as #splash, so it hands over without a jump) -->
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="icons/launch-1125x2436-light.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" href="icons/launch-1125x2436-dark.png">
<!-- logo + name + status centered as one group (the logo alone sits 31 px above the middle) -->
<!-- shown before app.css and the scripts arrive; js/app.js fades it out once there's something to show -->
<style>
#splash { position: fixed; top: 0; left: 0; right: 0; height: 100vh; z-index: 50; background: #f2f3f5; color: #1d2125;
          font: 15px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; transition: opacity 250ms; }
@media (prefers-color-scheme: dark) { #splash { background: #16181b; color: #eef0f2; } }
#splash img { position: absolute; left: 50%; top: calc(50% - 79px); width: 96px; height: 96px; margin-left: -48px; border-radius: 22px; }
#splash .sp-name { position: absolute; left: 0; right: 0; top: calc(50% + 31px); text-align: center; font-size: 20px; font-weight: 700; }
#splash .sp-text { position: absolute; left: 0; right: 0; top: calc(50% + 63px); text-align: center; font-size: 13px; opacity: .6; }
#splash.gone { opacity: 0; pointer-events: none; }
html[data-embed] #splash { display: none; }
</style>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
    <section id="details" class="page">
        <header id="hdr"></header>
        <main id="scroll"><div id="ptr"></div><div id="body"></div></main>
        <footer id="ftr" class="ftr"></footer>
    </section>

    <!-- the places list (like Apple Weather's): opened from the list button in the bottom bar -->
    <section id="listPage" class="page">
        <div id="listTop"></div>
        <div class="lsearch"><div class="lsearch-in">
            <div class="search-wrap">
                <svg class="ic" width="17" height="17" viewBox="0 0 32 32" aria-hidden="true"><circle cx="14" cy="14" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M20 20l7 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
                <input id="lq" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="River, town, bay or gauge id">
            </div>
            <button id="lqCancel" class="lq-cancel" tabindex="-1">Cancel</button>
        </div></div>
        <div id="listTools"></div>
        <main id="listScroll"><div id="listBody"></div></main>
        <button id="listCommit" class="commit"></button>
    </section>

    <section id="addPage" class="page">
        <div class="add-top">
            <button id="addBack" class="back-btn"><svg class="ic" width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><path d="M20 5L9 16l11 11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
            <h2 id="addTitle">Add a place</h2>
        </div>
        <div class="search-wrap">
            <svg class="ic" width="17" height="17" viewBox="0 0 32 32" aria-hidden="true"><circle cx="14" cy="14" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M20 20l7 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
            <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
        <main id="addScroll"><div id="addBody"></div></main>
        <button id="addCommit" class="commit"></button>
    </section>

    <section id="movePage" class="page">
        <div class="add-top">
            <button id="moveBack" class="back-btn"><svg class="ic" width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><path d="M20 5L9 16l11 11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
            <h2 id="moveTitle"></h2>
        </div>
        <main id="moveScroll"><div id="moveBody"></div></main>
    </section>

    <div id="toast"><span id="toastText"></span><button id="toastAct" hidden></button></div>
</div>
<div id="splash"><img src="icons/icon-512.png" alt=""><div class="sp-name">Flow Tides</div><div class="sp-text" id="splashText">Loading data…</div></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
